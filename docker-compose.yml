services:
  postgres:
    image: postgres:16
    container_name: e3-postgres
    restart: always
    environment:
      POSTGRES_USER: e3user
      POSTGRES_PASSWORD: e3pass
      POSTGRES_DB: e3crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: e3-evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: e3-evolution-key
      DATABASE_ENABLED: "false"
    volumes:
      - evolution_data:/evolution/instances

volumes:
  postgres_data:
  evolution_data: